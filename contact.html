<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Manas Portfolio</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/flexbox.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .contact-section { padding:5rem 2rem; max-width:860px; margin:0 auto; }
    .contact-section h1 { text-align:center; font-size:2.2rem; margin-bottom:.4rem; }
    .subtitle { text-align:center; color:#777; margin-bottom:3rem; }
    .info-item { display:flex; align-items:center; gap:1rem; margin-bottom:1.4rem; font-size:.95rem; color:#444; }
    .form-group { margin-bottom:1.4rem; }
    .form-group label { display:block; font-weight:600; margin-bottom:.4rem; color:#333; }
    .form-group input, .form-group textarea { width:100%; padding:.8rem 1rem; border:2px solid #ddd; border-radius:8px; font-size:1rem; font-family:inherit; transition:border .25s; box-sizing:border-box; }
    .form-group input:focus, .form-group textarea:focus { border-color:#1a1a2e; outline:none; }
    .form-group textarea { height:145px; resize:vertical; }
    .btn-submit { width:100%; padding:1rem; background:#e94560; color:#fff; border:none; border-radius:8px; font-size:1.05rem; font-weight:700; cursor:pointer; transition:background .3s; }
    .btn-submit:hover { background:#c73652; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">Manas</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
  </nav>
  <section class="contact-section">
    <h1>Get In Touch</h1>
    <p class="subtitle">Have a question or want to collaborate? Drop a message!</p>
    <div class="contact-grid">
      <div class="contact-info">
        <h3 style="margin-bottom:1.5rem">Contact Info</h3>
        <div class="info-item"><span>Email :</span><span>manaspratap2003@gmail.com</span></div>
        <div class="info-item"><span>Phone :</span><span>+91 XXXXX XXXXX</span></div>
        <div class="info-item"><span>Location :</span><span>India</span></div>
        <div class="info-item"><span>Status :</span><span>Open for Internship</span></div>
      </div>
      <form class="contact-form" id="contact-form" novalidate>
        <div class="form-group"><label for="name">Full Name</label><input type="text" id="name" placeholder="Your full name" required></div>
        <div class="form-group"><label for="email">Email Address</label><input type="email" id="email" placeholder="your@email.com" required></div>
        <div class="form-group"><label for="subject">Subject</label><input type="text" id="subject" placeholder="What is this about?"></div>
        <div class="form-group"><label for="message">Message</label><textarea id="message" placeholder="Write your message here..." required></textarea></div>
        <button type="submit" class="btn-submit">Send Message</button>
      </form>
    </div>
  </section>
  <footer><p>&copy; 2026 Manas. All Rights Reserved.</p></footer>
  <script src="js/script.js"></script>
</body>
</html>
