    .gallery-section { padding: 3rem 2rem; }
    .gallery-section h2 { text-align: center; font-size: 2rem; margin-bottom: 2rem; }
    .gallery-item img { width: 100%; height: 200px; object-fit: cover; transition: transform .3s; }

    .gallery-caption { padding: .5rem; text-align: center; background: #fff; font-size: .85rem; color: #555; }
  </style>
</head>

    <h2>Photo Gallery</h2>
    <div class="gallery-grid">
      <div class="gallery-item"><img src="https://via.placeholder.com/260x200?text=Snap+1" alt="Snap 1"><p class="gallery-caption">Snapshot 1</p></div>
